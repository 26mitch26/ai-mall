server:
  port: 8084

spring:
  application:
    name: agent-ops
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:ollama-local}
      base-url: ${AI_OPENAI_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AGENT_LLM_MODEL:qwen3.5-noVL:latest}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aiops-consumer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: false
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      # 与 docker-compose 的 NEO4J_AUTH 保持一致，支持环境变量覆盖
      password: ${NEO4J_PASSWORD:neo4j123}

aiops:
  eventbus:
    # 课设单机演示走同步本地事件总线；生产可设为 false 接入 Kafka。
    local-mode: ${AIOPS_LOCAL_MODE:true}
  llm:
    base-url: ${AGENT_LLM_BASE_URL:http://localhost:11434/api/chat}
    model: ${AGENT_LLM_MODEL:qwen3.5-noVL:latest}
    enabled: ${AIOPS_LLM_ENABLED:true}
  # 指标采集面：定时拉取被监控目标的 Micrometer 指标。
  # 目标格式 baseUrl|metric|service，仅允许来自本配置（不接受请求参数，避免 SSRF）。
  # 为空时不做任何外部请求；被监控服务需暴露 /actuator/metrics。
  watch:
    interval-ms: 30000
    initial-delay-ms: 20000
    timeout-ms: 2000
    targets: ${AIOPS_WATCH_TARGETS:}
  # 门控审批单落盘（人工签字记录，重启不丢）
  gate:
    file: ${AIOPS_GATE_FILE:aiops-gate-decisions.json}
    max-retained: 200
  # 处置执行模式：simulated=模拟推演（默认，唯一安全选项）；disabled=只审批不推演。
  # 没有 real 模式：本项目无任何 K8s/发布平台/SSH 执行器依赖，也不应在演示环境真重启服务。
  execution:
    mode: ${AIOPS_EXECUTION_MODE:simulated}
  topics:
    alerts: aiops.alerts
    events: aiops.events
    commands: aiops.commands
    audit: aiops.audit

# Actuator：docker-compose / K8s 探针与 Prometheus 抓取的实际目标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: ping
  health:
    ping:
      # defaults.enabled=false 会连 ping 一起关掉，而 liveness/readiness 组必须包含它
      enabled: true
    defaults:
      # Redis / Neo4j / Kafka 对本服务都是可选依赖（Neo4j 有内存图谱降级路径）。
      # 若把它们计入默认健康检查，这些依赖没起时 /actuator/health 会返回 503，
      # K8s 探针与 docker-compose healthcheck 会误判服务已死。探针只反映服务自身存活。
      enabled: false

logging:
  level:
    com.ai.mall.agent.ops: DEBUG
