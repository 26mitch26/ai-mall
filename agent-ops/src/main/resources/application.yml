server:
  port: 8084

spring:
  application:
    name: agent-ops
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: aiops-consumer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    neo4j:
      uri: bolt://localhost:7687
      authentication:
        username: neo4j
        # 与 docker-compose 的 NEO4J_AUTH 保持一致，支持环境变量覆盖
        password: ${NEO4J_PASSWORD:neo4j123}

aiops:
  topics:
    alerts: aiops.alerts
    events: aiops.events
    commands: aiops.commands
    audit: aiops.audit

logging:
  level:
    com.ai.mall.agent.ops: DEBUG
