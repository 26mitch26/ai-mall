---
# ConfigMap for mall-admin
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: ai-mall
data:
  application-k8s.yml: |
    spring:
      datasource:
        url: jdbc:mysql://mysql:3306/mall_admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 10
          minimum-idle: 5
      redis:
        host: redis
        port: 6379
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
    jwt:
      secret: ${JWT_SECRET}
      expiration: 86400000
    app:
      config:
        jwt-secret: ${JWT_SECRET}
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-admin
  namespace: ai-mall
  labels:
    app: mall-admin
    component: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-admin
  template:
    metadata:
      labels:
        app: mall-admin
        component: admin
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mall-admin
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mall-admin
          image: ${DOCKER_REGISTRY}/mall-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: jwt-secret
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: mall-admin
  namespace: ai-mall
  labels:
    app: mall-admin
    component: admin
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: mall-admin