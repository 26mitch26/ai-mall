---
# ConfigMap for gateway routes
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: ai-mall
data:
  application.yml: |
    spring:
      cloud:
        gateway:
          routes:
            - id: mall-admin
              uri: http://mall-admin:8080
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
            - id: mall-portal
              uri: http://mall-portal:8081
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1
            - id: mall-search
              uri: http://mall-search:8082
              predicates:
                - Path=/search/**
              filters:
                - StripPrefix=1
            - id: agent-customer
              uri: http://agent-customer:8082
              predicates:
                - Path=/agent/customer/**
              filters:
                - StripPrefix=2
            - id: agent-ops
              uri: http://agent-ops:8083
              predicates:
                - Path=/agent/ops/**
              filters:
                - StripPrefix=2
            - id: agent-test
              uri: http://agent-test:8085
              predicates:
                - Path=/agent/test/**
              filters:
                - StripPrefix=2
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: ai-mall
  labels:
    app: ai-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
        component: gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - ai-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ai-gateway
          image: ${DOCKER_REGISTRY}/ai-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CONFIG_IMPORT
              value: "configmap:gateway-config"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: ai-mall
  labels:
    app: ai-gateway
    component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: ai-gateway