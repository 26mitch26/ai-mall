---
# ============================================================
# agent-customer
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-customer
  namespace: ai-mall
  labels:
    app: agent-customer
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-customer
  template:
    metadata:
      labels:
        app: agent-customer
        component: agent
    spec:
      containers:
        - name: agent-customer
          image: ${DOCKER_REGISTRY}/agent-customer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: agent-customer
  namespace: ai-mall
  labels:
    app: agent-customer
    component: agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP
  selector:
    app: agent-customer
---
