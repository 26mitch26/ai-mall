apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-mall-ingress
  namespace: ai-mall
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: mall.local
      http:
        paths:
          - path: /admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mall-admin
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mall-portal
                port:
                  number: 8081
          - path: /search(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: mall-search
                port:
                  number: 8082
          - path: /agent/customer(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-customer
                port:
                  number: 8082
          - path: /agent/ops(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-ops
                port:
                  number: 8083
          - path: /agent/test(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-test
                port:
                  number: 8085