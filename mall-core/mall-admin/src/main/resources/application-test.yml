spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/mall_test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:root}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 5
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: druid
        login-password: druid
  data:
    redis:
      host: localhost
      database: 0
      port: ${REDIS_PORT:6379}
      password:
      timeout: 300ms

minio:
  endpoint: http://localhost:${MINIO_PORT:9000}
  bucketName: mall_test
  accessKey: minioadmin
  secretKey: minioadmin

logging:
  level:
    root: warn
    com.ai.mall: info

logstash:
  host: localhost
  enableInnerLog: false
