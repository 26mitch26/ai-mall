server:
  port: 8081 # 与 ai-gateway(8080) 及其他模块端口错开，避免冲突

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: mall-admin
  profiles:
    active: dev #默认为开发环境
  servlet:
    multipart:
      enabled: true #开启文件上传
      max-file-size: 10MB #限制文件上传大小为10M
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

# 压测修复（2026-09-05 第二轮）：实际生效的是 MyBatis-Plus 自动配置(mall-common 引入
# mybatis-plus-spring-boot3-starter)，必须走 mybatis-plus.mapper-locations，否则 OmsOrderDao.xml
# 等自定义 XML 不被加载 → Invalid bound statement (not found)。
mybatis-plus:
  mapper-locations:
    - classpath*:dao/*.xml
    - classpath*:com/**/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: ${JWT_SECRET:default-dev-secret-change-in-prod}
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

redis:
  database: mall
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
    product: 'pms:product'
    productList: 'pms:product:list'
  expire:
    common: 86400 # 24小时
    product: 1800 # 30分钟

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui/
      - /v3/api-docs/*
      - /v3/api-docs
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/health
      - /actuator/info
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
      - /minio/upload
      - /aliyun/oss/policy

springdoc:
  swagger-ui:
    # Swagger UI 与 Boot 3.5 PathPatternParser 不兼容（/swagger-ui/**/*swagger-initializer.js 非法）
    # 联调阶段暂时关闭，后续升级 springdoc 或降 Boot 版本时再开启
    enabled: false
  api-docs:
    # 自动化测试 Agent 通过该 JSON 契约发现接口；仅关闭 Swagger UI 页面即可。
    enabled: true

aliyun:
  oss:
    endpoint: oss-cn-shenzhen.aliyuncs.com # oss对外服务的访问域名
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:your-access-key-id}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:your-access-key-secret}
    bucketName: macro-oss # oss的存储空间
    policy:
      expire: 300 # 签名有效期(S)
    maxSize: 10 # 上传文件大小(M)
    callback: http://localhost:8080/aliyun/oss/callback # 文件上传成功后的回调地址
    dir:
      prefix: mall/images/ # 上传文件夹路径前缀
