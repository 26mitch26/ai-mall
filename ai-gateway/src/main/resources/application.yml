server:
  port: 8080

spring:
  application:
    name: ai-gateway
  main:
    # 父 POM 全局引入了 spring-boot-starter-web（WebMvc），
    # 网关基于 WebFlux，必须显式声明为响应式应用，否则默认按 Servlet 模式启动导致路由不生效
    web-application-type: reactive
  profiles:
    active: dev
  cloud:
    gateway:
      routes:
        - id: mall-admin
          predicates:
            - Path=/admin/**
          # 项目未引入注册中心，路由使用直连地址；容器部署时可用环境变量覆盖
          uri: ${GATEWAY_ROUTE_ADMIN:http://localhost:8081}
          filters:
            - StripPrefix=0
        - id: mall-portal
          predicates:
            - Path=/api/**
          uri: ${GATEWAY_ROUTE_PORTAL:http://localhost:8087}
          filters:
            - StripPrefix=0
        - id: mall-search
          predicates:
            - Path=/search/**
          uri: ${GATEWAY_ROUTE_SEARCH:http://localhost:8082}
          filters:
            - StripPrefix=0
        - id: agent-customer
          predicates:
            - Path=/agent/customer/**
          uri: ${GATEWAY_ROUTE_CUSTOMER:http://localhost:8083}
          filters:
            - StripPrefix=0
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: '*'
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
            maxAge: 3600
  data:
    redis:
      host: localhost
      port: 6379
  security:
    filter:
      order: -100

jwt:
  tokenHeader: Authorization
  secret: ${JWT_SECRET:default-dev-secret-change-in-prod}
  expiration: 604800
  tokenHead: 'Bearer '

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        failureRateThreshold: 60
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInClosedState: 100
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerslimevents
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ai.mall.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
