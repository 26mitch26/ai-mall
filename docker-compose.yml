services:
  # ==================== 基础设施 ====================

  # MySQL 使用 Windows 本机服务（默认 127.0.0.1:3306），不再由 Compose 创建。
  # 数据库初始化请运行 scripts/init-local-db.ps1。

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: ai-mall-redis
    # 本地开发不设密码，与各模块 application-dev.yml 的 redis 配置保持一致；
    # 生产环境请通过 REDIS_PASSWORD 显式启用 requirepass
    command: redis-server ${REDIS_ARGS:---appendonly yes}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch 8.15.3
  elasticsearch:
    # Spring Boot 3.5 / Spring Data Elasticsearch 面向 ES 8.x，此处使用 ES 8 而非 7.x
    image: elasticsearch:8.15.3
    container_name: ai-mall-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # 本地开发关闭安全认证（各服务 yml 未配置账号密码）
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-plugins:/usr/share/elasticsearch/plugins
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # IK分词插件安装（需在ES启动后执行）
  elasticsearch-ik-setup:
    image: elasticsearch:8.15.3
    container_name: ai-mall-es-ik-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - elasticsearch-plugins:/usr/share/elasticsearch/plugins
    entrypoint: >
      bash -c "
        if [ ! -d /usr/share/elasticsearch/plugins/ik ]; then
          elasticsearch-plugin install https://github.com/infinilabs/analysis-ik/releases/download/v8.15.3/elasticsearch-analysis-ik-8.15.3.zip
        fi
      "
    networks:
      - ai-mall-network

  # ==================== 文档数据库 ====================

  # MongoDB 7（mall-portal 操作日志/浏览记录存储）
  mongo:
    image: mongo:7.0
    container_name: ai-mall-mongo
    environment:
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 消息队列 ====================

  # RabbitMQ（mall-portal 取消订单等异步消息，管理面板 http://localhost:15672）
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ai-mall-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mall}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mall}
      RABBITMQ_DEFAULT_VHOST: /mall
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (Kafka依赖)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ai-mall-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - ai-mall-network

  # Kafka 3.8
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ai-mall-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 向量数据库 ====================

  # Etcd (Milvus依赖)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ai-mall-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - ai-mall-network

  # MinIO (Milvus依赖)
  minio:
    image: minio/minio:latest
    container_name: ai-mall-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ai-mall-network

  # Milvus 2.4
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: ai-mall-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== 知识图谱 ====================

  # Neo4j 5.25
  neo4j:
    image: neo4j:5.25-community
    container_name: ai-mall-neo4j
    environment:
      # 与 agent-ops 的 application.yml 默认值保持一致
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - ai-mall-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  elasticsearch-data:
  elasticsearch-plugins:
  mongo-data:
  rabbitmq-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  etcd-data:
  minio-data:
  milvus-data:
  neo4j-data:
  neo4j-logs:

networks:
  ai-mall-network:
    driver: bridge
