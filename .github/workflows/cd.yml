name: CD - Deploy to Production

on:
  push:
    branches: [main, master]
    tags: ['v*']

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  KUBERNETES_NAMESPACE: ai-mall

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - module: mall-core/mall-admin
            image: mall-admin
          - module: mall-core/mall-portal
            image: mall-portal
          - module: mall-core/mall-search
            image: mall-search
          - module: ai-gateway
            image: ai-gateway
          - module: agent-customer
            image: agent-customer
          - module: agent-ops
            image: agent-ops
          - module: agent-test
            image: agent-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn clean package -pl ${{ matrix.service.module }} -am -DskipTests=true --no-transfer-progress

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version tag
        id: version
        run: |
          echo "tag=$(echo ${{ github.ref }} | sed 's|refs/tags/v||' | sed 's|refs/heads/||')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.module }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.service.image }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ matrix.service.image }}:${{ steps.version.outputs.tag }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBE_CONFIG" > $HOME/.kube/config

      - name: Apply namespace
        run: kubectl apply -f infra/k8s/namespace.yaml -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Apply infrastructure deployments
        run: kubectl apply -f infra/k8s/infra-deployment.yaml -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Apply application deployments
        run: |
          sed -i 's|\${DOCKER_REGISTRY}|${{ env.DOCKER_REGISTRY }}|g' infra/k8s/*.yaml
          kubectl apply -f infra/k8s/gateway-deployment.yaml -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl apply -f infra/k8s/admin-deployment.yaml -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl apply -f infra/k8s/portal-deployment.yaml -n ${{ env.KUBERNETES_NAMESPACE }}
          kubectl apply -f infra/k8s/agents-deployment.yaml -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Apply ingress
        run: kubectl apply -f infra/k8s/ingress.yaml -n ${{ env.KUBERNETES_NAMESPACE }}

      - name: Verify rollout status
        run: |
          kubectl rollout status deployment/gateway -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/mall-admin -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/mall-portal -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/agent-customer -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/agent-ops -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/agent-test -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=120s

      - name: Deployment notification
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Release version: ${{ steps.version.outputs.tag }}"
          echo "Gateway: http://gateway.${{ env.KUBERNETES_NAMESPACE }}.svc.cluster.local:8080"