# Local-first feature switches; optional services fail back to the existing deterministic path.
agent.knowledge.admin-token=${KNOWLEDGE_ADMIN_TOKEN:}
ai.rag.retrieval.strategy=${AI_RAG_RETRIEVAL_STRATEGY:auto}
ai.rag.retrieval.scope=public
ai.rag.reranker.enabled=${AI_RAG_RERANKER_ENABLED:false}
ai.rag.reranker.url=${AI_RAG_RERANKER_URL:http://127.0.0.1:8092/rerank}
ai.rag.reranker.timeout=${AI_RAG_RERANKER_TIMEOUT:PT2S}
ai.rag.graph.enabled=${AI_RAG_GRAPH_ENABLED:false}
ai.rag.graph.uri=${AI_RAG_GRAPH_URI:bolt://127.0.0.1:7687}
ai.rag.graph.username=${AI_RAG_GRAPH_USERNAME:neo4j}
ai.rag.graph.password=${AI_RAG_GRAPH_PASSWORD:}
ai.vision.base-url=${AI_VISION_BASE_URL:http://127.0.0.1:11434/api/chat}
ai.vision.model=${AI_VISION_MODEL:qwen3-vl:latest}
agent.mcp.allowed-origins=${AGENT_MCP_ALLOWED_ORIGINS:}
agent.workflow.execution-timeout-ms=60000
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=${AGENT_OTLP_EXPORT_ENABLED:false}
management.otlp.tracing.endpoint=${AGENT_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}
logging.level.org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration=ERROR
