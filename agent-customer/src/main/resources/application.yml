server:
  port: 8083

spring:
  application:
    name: agent-customer
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      api-key: ${MIMO_API_KEY:${OPENAI_API_KEY:}}
      base-url: https://api.mimo.xiaomi.com/v1
      chat:
        options:
          model: MiMo-7B
          temperature: 0.7
          max-tokens: 2048

ai:
  model:
    mimo:
      api-key: ${MIMO_API_KEY:}
      base-url: https://api.mimo.xiaomi.com/v1
      model: MiMo-7B
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4
    router:
      primary: mimo
      fallback: openai

logging:
  level:
    com.ai.mall.agent.customer: DEBUG
