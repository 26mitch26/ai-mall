# Explicit evaluation profile for 16GB machines. Report separately from full semantic retrieval.
ai.rag.retrieval.strategy=exact
ai.rag.vector-store.enabled=false
ai.rag.retrieval.vector-fallback-enabled=false
ai.rag.reranker.semantic-feature-enabled=false
ai.model.llm.context-tokens=2048
ai.model.llm.threads=4
ai.customer.semantic-cache.enabled=false
ai.memory.archive-enabled=false
